[project]
name = "agrios"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=1.2.5",
    "langchain-ollama>=0.3.0",
    "langchain>=1.3.9",
    "langgraph-checkpoint-sqlite>=3.1.0",
    "langfuse>=3.0.0",
    "python-dotenv>=1.0.0",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.13.4",
    "langgraph-checkpoint-postgres>=3.2.0",
    "psycopg[binary]>=3.3.6",
]

[project.optional-dependencies]
vision = [
    "numpy>=2.0",
    "opencv-python-headless>=4.10",
    "scipy>=1.14",
]

[dependency-groups]
dev = [
    "motmetrics>=1.4",
    "mypy>=1.18",
    "pytest>=9.1.1",
    "ruff>=0.13",
]

# Lint and type gates apply to vision/ only: it was written to them from the
# start. The agent code predates them and isn't held to them yet.
[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["cpp", "langfuse-server", "farm-ops-agent"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF", "NPY", "PT", "C4", "PIE", "PERF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["vision"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["scipy.*", "motmetrics.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["vision.tests.*"]
disallow_untyped_defs = false
disallow_any_generics = false
